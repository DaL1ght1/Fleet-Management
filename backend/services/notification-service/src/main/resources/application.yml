spring:
  application:
    name: notification-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgresql:5432/notifications}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://keycloak:8080/realms/Smart-Street/protocol/openid-connect/certs}
  threads:
    virtual:
      enabled: true

server:
  port: 8080

dgs:
  graphql:
    virtualthreads:
      enabled: true
    graphiql:
      enabled: ${GRAPHIQL_ENABLED:false}

smartstreet:
  security:
    router-secret: ${ROUTER_SECRET}
