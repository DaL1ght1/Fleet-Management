extend schema
@link(url: "https://specs.apollo.dev/federation/v2.6", import: ["@key"])

scalar UUID
scalar Date
scalar DateTime
scalar Long
scalar BigDecimal

type Vehicle @key(fields: "id") {
    id: UUID!
    workOrders: [WorkOrder!]!
}

enum WorkOrderKind {
    PREVENTIVE
    REPAIR
    INSPECTION
}

enum WorkOrderPriority {
    LOW
    MEDIUM
    HIGH
    CRITICAL
}

enum WorkOrderStatus {
    SCHEDULED
    IN_PROGRESS
    COMPLETED
    CANCELLED
}

type WorkOrder @key(fields: "id") {
    id: UUID!
    vehicle: Vehicle!
    kind: WorkOrderKind!
    priority: WorkOrderPriority!
    status: WorkOrderStatus!
    title: String!
    description: String
    vendor: String
    scheduledFor: Date!
    overdue: Boolean!
    autoGenerated: Boolean!
    startedAt: DateTime
    completedAt: DateTime
    odometerKm: Long
    partsCost: BigDecimal
    laborCost: BigDecimal
    totalCost: BigDecimal!
    resolutionNotes: String
    cancellationReason: String
    createdAt: DateTime!
    updatedAt: DateTime!
}

type WorkOrderPage {
    items: [WorkOrder!]!
    totalCount: Int!
    page: Int!
    size: Int!
    hasNext: Boolean!
}

type MaintenanceStatistics {
    scheduled: Int!
    inProgress: Int!
    overdue: Int!
    completedThisMonth: Int!
    costThisMonth: BigDecimal!
}

input WorkOrderInput {
    vehicleId: UUID!
    kind: WorkOrderKind!
    priority: WorkOrderPriority!
    title: String!
    description: String
    vendor: String
    scheduledFor: Date!
}

input UpdateWorkOrderInput {
    kind: WorkOrderKind
    priority: WorkOrderPriority
    title: String
    description: String
    vendor: String
    scheduledFor: Date
}

input CompleteWorkOrderInput {
    partsCost: BigDecimal
    laborCost: BigDecimal
    odometerKm: Long
    resolutionNotes: String
}

input WorkOrderFilter {
    status: WorkOrderStatus
    kind: WorkOrderKind
    vehicleId: UUID
    overdue: Boolean
}

type Query {
    workOrder(id: UUID!): WorkOrder
    workOrders(filter: WorkOrderFilter, page: Int = 0, size: Int = 20): WorkOrderPage!
    maintenanceStatistics: MaintenanceStatistics!
}

type Mutation {
    scheduleWorkOrder(input: WorkOrderInput!): WorkOrder!
    updateWorkOrder(id: UUID!, input: UpdateWorkOrderInput!): WorkOrder!
    startWorkOrder(id: UUID!): WorkOrder!
    completeWorkOrder(id: UUID!, input: CompleteWorkOrderInput!): WorkOrder!
    cancelWorkOrder(id: UUID!, reason: String!): WorkOrder!
}
